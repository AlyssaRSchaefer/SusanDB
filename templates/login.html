<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nursing Student Report Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
  <style>
    body {
      background-color: var(--primary-color-highlight);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
      margin: 0;
    }
  
    .container {
      text-align: center;
      position: relative;
    }
  
    h1 {
      color: white;
      margin-bottom: 20px;
      font-weight: lighter;
      font-size: 500%;
      font-family: var(--font-primary);
    }
  
    .login-box {
      background: var(--secondary-color);
      padding: 30px;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 250px;
      height: 80px;
      margin: 20px auto 0; /* This ensures it is centered and adds space from the login box */
    }
  
    .loading {
      display: none;
      width: 30px;
      height: 30px;
      border: 4px solid white;
      border-top: 4px solid #A9A9C7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
  
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  
    .icon {
      width: 120px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }
  
    .left-icon {
      left: -150px;
    }
  
    .right-icon {
      right: -150px;
    }
  
    .access-denied-box {
      background-color: #ffebea; /* Red background for error */
      color: rgb(76, 76, 76);
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      margin: 20px auto 0; /* This ensures it is centered and adds space from the login box */
      display: block;
      text-align: center; /* Center the text inside the box */
    }
  
    .access-denied-box p {
      margin: 0;
      font-size: 16px;
    }

    #startup-status-icons {
      position: absolute;
      left: 20px;
      bottom: 20px;
      z-index: 1001;
      display: flex;
      gap: 16px;
    }
    .status-icon {
      font-size: 2em;
      cursor: pointer;
      transition: color 0.2s;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ReportGen</h1>
    <p class="text">Please download and select your database file to continue</p>

    <div class="login-box">
      <form id="excelForm" enctype="multipart/form-data">
        <input type="file" id="excelInput" name="excel" accept=".xlsx,.xls" class="text" style="width: 100%; margin-bottom: 10px; background-color: var(--secondary-color-highlight); color: var(--quarternary-color);" />
        <button class="primary-button" id="uploadButton" type="button" style="width: 100%; margin-top: 10px;">SELECT EXCEL SHEET</button>
        <div id="loadingSpinner" class="loading" style="margin-left: auto; margin-right: auto;"></div>
      </form>
    </div>

    <!-- used if excel fails to upload-->
    <div class="access-denied-box" id="access-denied-box" style="display: none;"></div>

    <img src="static/icons/icon-nurse.png" alt="Doctor Icon" class="icon left-icon">
    <img src="static/icons/icon-db.png" alt="Database Icon" class="icon right-icon">
  </div>

  <!-- Startup status icons -->
  <div id="startup-status-icons">
    <span class="status-icon" id="template-status">
      <i class="fa fa-file-excel-o"></i>
    </span>
    <span class="status-icon" id="fieldorder-status">
      <i class="fa fa-list-alt"></i>
    </span>
  </div>

  <!-- Help icon for Excel format warning -->
  <div id="excel-help-icon" style="position: fixed; right: 24px; bottom: 24px; z-index: 2000; cursor: pointer;">
    <i class="fa fa-question-circle" style="font-size: 2.5em; color: var(--quarternary-color);"></i>
    <img id="excel-format-warning" src="static/excel_format_warning.png" alt="Excel Format Warning" style="display:none; position:absolute; right:40px; bottom:40px; z-index:2001; max-width:320px; box-shadow:0 2px 8px rgba(0,0,0,0.15); border-radius:8px; background:white;" />
  </div>

  <script>

    document.getElementById('uploadButton').addEventListener('click', function() {
      var input = document.getElementById('excelInput');
      var accessDeniedBox = document.getElementById('access-denied-box');
      if (accessDeniedBox) {
        accessDeniedBox.style.display = 'none';
      }
      if (!input.files.length) {
        if (accessDeniedBox) {
          accessDeniedBox.innerHTML = '<p>Please select an Excel file.</p>';
          accessDeniedBox.style.display = 'block';
        }
        return;
      }
      document.getElementById('uploadButton').style.display = "none";
      document.getElementById('loadingSpinner').style.display = "block";
      var formData = new FormData();
      formData.append('excel', input.files[0]);
      fetch('/login', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('loadingSpinner').style.display = "none";
        if (data.success) {
          window.location.href = '/database';
        } else {
          if (accessDeniedBox) {
            accessDeniedBox.innerHTML = `<p>${data.error || 'Upload failed.'}</p>`;
            accessDeniedBox.style.display = 'block';
          }
          document.getElementById('uploadButton').style.display = "block";
        }
      })
      .catch(() => {
        document.getElementById('loadingSpinner').style.display = "none";
        if (accessDeniedBox) {
          accessDeniedBox.innerHTML = '<p>Upload failed.</p>';
          accessDeniedBox.style.display = 'block';
        }
        document.getElementById('uploadButton').style.display = "block";
      });
    });

    // Set icon colors and tooltips based on startup_status
    const startupStatus = {{ startup_status | tojson | safe }};
    function setStatusIcons() {
      const templateIcon = document.getElementById('template-status');
      const fieldOrderIcon = document.getElementById('fieldorder-status');
      if (startupStatus.templates === 'found') {
        templateIcon.style.color = 'var(--secondary-color)';
        templateIcon.title='templates.xlsx has been located in your launch folder and will be used';
      } else {
        templateIcon.style.color = '#800320';
        templateIcon.title='templates.xlsx has not been found, and a blank document has been created for you. If this is in error, please replace with the correct document and restart the app';
      }
      if (startupStatus.field_order === 'found') {
        fieldOrderIcon.style.color = 'var(--secondary-color)';
        fieldOrderIcon.title ='field_order.txt has been located in your launch folder and will be used';
      } else {
        fieldOrderIcon.style.color = '#800320';
        fieldOrderIcon.title ='field_order.txt has not been found, and a blank document has been created for you. If this is in error, please replace with the correct document and restart the app';
      }
    }
    setStatusIcons();

    // Show excel_format_warning.png on hover of the help icon
    const helpIcon = document.getElementById('excel-help-icon');
    const warningImg = document.getElementById('excel-format-warning');
    helpIcon.addEventListener('mouseenter', function() {
      warningImg.style.display = 'block';
    });
    helpIcon.addEventListener('mouseleave', function() {
      warningImg.style.display = 'none';
    });
  </script>
</body>
</html>
